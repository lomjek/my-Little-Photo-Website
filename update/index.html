<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="updaters.css" type="text/css"/>
        <script src="add_script.js"></script>
        <title>Add Images</title>
    </head>
    <body>
        <h1 id="titl" style="text-align: center; font-size: 50px;">Update Collections</h1>
        <form method="POST" enctype="multipart/form-data" action="upload.php">
            
            <input placeholder="Collection name" class="text" oninput="is_collection_new()" id="cname" name="cname" type="text" required>
            <input type="hidden" id="newc" name="newc" value="true">

            <label for="cdate" id="lcdate">Collection date (If left empt it will not be displayed)</label>
            <input class="text" id="cdate" name="cdate" type="date">
            <label for="ctcol" id="lctcol">Collection text color</label>
            <input placeholder="Collection text color" class="text" onchange="change_color()" id="ctcol" name="ctcol" type="color" value="#000000">
            <label for="cbcol" id="lcbcol">Collection background color</label>
            <input placeholder="Collection background color" onchange="change_background()" class="text" id="cbcol" name="cbcol" type="color" value="#aaaaaa"> 
            
            <label for="imgs">Images: </label><input id="imgs" name="file[]" type="file" multiple accept=".jpg,.jpeg,.png" required> 
            
            <input class="text" type="submit"> 
        </form>

        <form method="POST" enctype="application/x-www-form-urlencoded" action="select.php" id="f2"></form>

    </body>
</html>
